<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terry Chen</title>
  <meta name="description" content="Terry Chen — portfolio.">
  <meta name="theme-color" content="#000000">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Full-screen WebGL scene: singularity -> explosion -> Gargantua -->
  <canvas id="blackhole" aria-hidden="true"></canvas>

  <!-- Appears after the explosion -->
  <header class="nav">
    <a class="nav__mark" href="#home">TC</a>
    <nav class="nav__links" aria-label="Main">
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="#experience">Experience</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <!-- The intro is tall so scrolling drives the collapse. After the explosion it shrinks to one screen. -->
    <section class="intro" id="home">
      <div class="stage">
        <div class="hero__content">
          <h1 class="hero__name">Terry Chen</h1>
          <p class="hero__tagline">Software Developer <span class="dot">•</span> Portfolio</p>
        </div>

        <div class="scroll-hint" aria-hidden="true">
          <span>Scroll</span>
          <i></i>
        </div>

        <button class="skip" type="button">Skip intro</button>
      </div>
    </section>

    <!-- Upcoming sections: #work, #about, #experience, #contact -->
  </main>

  <script src="js/blackhole.js"></script>
</body>
</html>
